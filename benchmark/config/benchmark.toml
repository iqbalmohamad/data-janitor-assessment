# Canonical generation configuration for the Northstar Distribution demo
# environment. Governed by "Current Assignment.md" (M0, revised per SPEC.md
# Amendment 001). The seed below is canonical for v0.1; changing it
# invalidates ground truth and requires a new assignment.

[generation]
seed = 20260910
as_of_date = "2026-09-01"
history_years = 3
scenario = "revenue_margin_reconciliation"
ground_truth_dir = "benchmark/ground_truth"

# PostgreSQL is the canonical Northstar environment (SPEC.md Amendment
# section O). Connection details are supplied via environment variable at
# generation time -- never hard-coded here or in generate.py.
[postgresql]
dsn_env_var = "NORTHSTAR_DATABASE_URL"
# Northstar's database is several schemas, not one namespace (see
# benchmark/README.md, Scenario Contract SC-7 and SC-9).
schemas = ["core", "finance", "analytics", "management"]

# DuckDB is internal-only: test utilities and local comparison during
# development. It is never Northstar's canonical environment.
[duckdb]
dev_mirror_path = "benchmark/data/northstar_dev.duckdb"

# Two scale profiles. Exact counts are configuration, not a success
# criterion (SPEC.md Amendment section P) -- realism and a coherent
# reconciliation take priority over row count.

[scale.demo]
customers = 25000
products = 3000
orders = 400000
order_items = 1200000
payments = 390000
returns = 22000

[scale.smoke]
customers = 300
products = 60
orders = 2000
order_items = 6000
payments = 1900
returns = 120
